name: Cardmarket-Preise aktualisieren

on:
  schedule:
    - cron: '17 5 * * *'   # täglich ca. 6:17 Uhr deutscher Zeit
    - cron: '17 15 * * *'  # und nachmittags, falls Cardmarket später veröffentlicht
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-prices.mjs'
      - '.github/workflows/update-prices.yml'

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preisliste von Cardmarket laden
        run: node scripts/update-prices.mjs
        env:
          PD_DEBUG: '1'
      - name: Änderungen speichern
        run: |
          if [ ! -f debug-names.json ] && git diff --quiet -- prices.json && git ls-files --error-unmatch prices.json >/dev/null 2>&1; then
            echo "Keine neuen Preise."
            exit 0
          fi
          git config user.name "pocketdeck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json debug-names.json 2>/dev/null || git add prices.json
          git commit -m "Cardmarket-Preise aktualisiert"
          git pull --rebase origin main
          git push
