name: Cardmarket-Preise aktualisieren

on:
  schedule:
    - cron: '17 5 * * *'   # täglich ca. 6:17 Uhr deutscher Zeit
    - cron: '17 15 * * *'  # und nachmittags, falls Cardmarket später veröffentlicht
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-prices.mjs'
      - '.github/workflows/update-prices.yml'

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preisliste und Zuordnung erstellen
        run: node scripts/update-prices.mjs
        env:
          PD_REPORT: '1'
      - name: Änderungen speichern
        run: |
          git add -A prices cm-map
          git rm -q --cached --ignore-unmatch debug-names.json
          rm -f debug-names.json
          if git diff --cached --quiet; then
            echo "Keine neuen Preise."
            exit 0
          fi
          git config user.name "pocketdeck-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Cardmarket-Preise aktualisiert"
          git pull -q --rebase origin main
          git push -q
