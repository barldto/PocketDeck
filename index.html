#app .pd-poketile{background:var(--pd-surface);padding:12px 8px;border-radius:17px;text-align:center;min-width:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}

#app .pd-poketile:not(.pd-has) img{filter:grayscale(1);opacity:.32}
#app .pd-herocard{display:block;width:100%;max-width:198px;aspect-ratio:.716;object-fit:contain;border-radius:12px;margin:auto;filter:drop-shadow(0 14px 17px light-dark(#16372220,#00000050))}
#app .pd-heroarea{padding:13px 0 5px;text-align:center}
#app .pd-heroarea .pd-small{margin-top:13px}
#app .pd-detailtitle{font-size:27px;letter-spacing:-.9px;font-weight:700}
#app .pd-price{font-size:31px;letter-spacing:-1px;line-height:1.2;font-weight:650;margin:9px 0}
#app .pd-stepper{display:flex;align-items:center;gap:12px}

#app .pd-upload{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:12px;background:var(--pd-surface);border:1px solid var(--pd-line);border-radius:14px;color:var(--pd-green);font-size:13px;min-height:44px}

#app .pd-upload:focus-within{outline:3px solid var(--pd-green);outline-offset:3px}
#app .pd-scanstage{position:relative;background:var(--pd-soft);padding:25px 20px;border-radius:25px;display:flex;justify-content:center;align-items:center;min-height:233px}
#app .pd-scanstage img{height:185px;aspect-ratio:.716;object-fit:contain;border-radius:8px;transform:rotate(-8deg);box-shadow:0 12px 18px light-dark(#143e2522,#00000045)}
#app .pd-scanframe{position:absolute;inset:18px 25%;border:1px dashed var(--pd-green);border-radius:14px;opacity:.65;pointer-events:none}

#app .pd-scanmark svg{width:24px;height:24px}
#app .pd-scanchoices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

#app .pd-choice[aria-pressed=true]{border-color:var(--pd-green);color:var(--pd-green);background:var(--pd-soft);font-weight:650}
#app .pd-scanresult{display:flex;gap:16px;align-items:center}
#app .pd-scanresult img{width:82px;aspect-ratio:.716;object-fit:contain;border-radius:7px;flex-shrink:0}
#app .pd-checkbox{display:flex;align-items:flex-start;gap:10px;font-size:13px;min-height:44px;padding:10px 0}

#app .pd-setting label{display:flex;align-items:center;gap:9px}
#app .pd-setting input[type=checkbox]{accent-color:var(--pd-green);width:20px;height:20px}
#app .pd-danger{color:var(--pd-danger)}
#app .pd-success{background:var(--pd-soft);color:var(--pd-green);padding:13px 15px;border-radius:14px;font-size:13px;display:flex;align-items:center;gap:9px}

#pd-nav button{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;color:var(--pd-muted);font-size:10px;min-height:49px;min-width:0;padding:5px 0;border-radius:12px}

@media(max-width:370px){#pd-header{padding:17px 15px 13px}#pd-content{padding:3px 15px 18px}#app{border-radius:21px}#app h1{font-size:27px}#app .pd-cardgrid{gap:15px 9px}#app .pd-value{font-size:35px}#app .pd-brand{font-size:17px}#app .pd-badge{font-size:9px;letter-spacing:.5px}}

:root{color-scheme:light dark}
html{scroll-behavior:smooth}
body{margin:0;background:light-dark(#f5f6f1,#111813);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-width:280px}
#app{max-width:560px;margin:0 auto;border-radius:0;box-shadow:none;overflow:visible;padding-bottom:calc(94px + env(safe-area-inset-bottom));min-height:100dvh}
#pd-header{padding-top:calc(21px + env(safe-area-inset-top))}
#pd-content{min-height:350px}
#pd-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;z-index:10;padding-bottom:calc(10px + env(safe-area-inset-bottom));box-sizing:border-box}
#app button{cursor:pointer}
#app button:disabled{cursor:default}
#app .pd-brand-button{display:flex;align-items:center;gap:9px;padding:0;text-align:left}
#app .pd-field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:550}
#app .pd-field select,#app .pd-field input,#app textarea{font:inherit;font-weight:400;font-size:16px;min-width:0;max-width:100%;width:100%;background:var(--pd-bg);color:var(--pd-fg);border:1px solid var(--pd-line);padding:12px;border-radius:12px}
#app .pd-field textarea{resize:vertical;box-sizing:border-box}
#app .pd-upload input{cursor:pointer}
#app .pd-art{display:block;position:relative;aspect-ratio:.716;width:100%;border-radius:9px;background:var(--pd-soft);overflow:hidden}
#app .pd-art img{width:100%;height:100%;object-fit:contain;display:block;position:relative;z-index:1}
#app .pd-art-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--pd-muted);font-size:10px;text-align:center;padding:8px}
#app .pd-art-fallback .pd-icon svg{width:24px;height:24px}
#app .pd-art-hero{max-width:238px;margin:auto;box-shadow:0 12px 24px light-dark(#15392118,#00000035)}
#app .pd-grey{filter:grayscale(1);opacity:.42}
#app .pd-cardtile{position:relative}
#app .pd-camera{position:relative;width:100%;aspect-ratio:.76;max-height:560px;border-radius:25px;overflow:hidden;background:var(--pd-soft);isolation:isolate}
#app .pd-camera video{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}
#app #pd-camera-frame{position:absolute;width:80%;aspect-ratio:.716;top:50%;left:50%;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 1500px #0000004d;pointer-events:none}
#app #pd-camera-frame{transition:border-color .2s}
#app #pd-camera-frame.pd-frame-ok{border-color:#5fd38d}
#app #pd-camera-frame.pd-frame-warn{border-color:#f5c451}
#app .pd-live-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:92%;overflow:hidden;text-overflow:ellipsis;background:#000000b8;color:#fff;font-size:13px;padding:7px 13px;border-radius:99px;white-space:nowrap;pointer-events:none;z-index:2}
#app .pd-live-hint:empty{display:none}
#app .pd-camera-tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
#app .pd-camera-tools button{width:44px;height:44px;border-radius:50%;border:0;background:#000000a6;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
#app .pd-camera-tools button[aria-pressed="true"]{background:#f5c451;color:#000}
#app .pd-zoom{display:flex;align-items:center;gap:10px;font-size:13px;min-height:44px}
#app .pd-zoom input{flex:1;accent-color:var(--pd-green)}
#app .pd-camera-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
#app .pd-camera-flash.pd-on{animation:pdflash .35s ease-out}
@keyframes pdflash{0%{opacity:.75}100%{opacity:0}}
#app .pd-camera-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;color:var(--pd-green);text-align:center;padding:35px}
#app .pd-camera-placeholder .pd-icon svg{width:76px;height:76px;stroke-width:1}
#app .pd-scanresult>.pd-art{max-width:84px;flex-shrink:0}
#pd-banner{padding:0 22px}
#app .pd-notice{padding:13px;display:flex;align-items:flex-start;gap:9px;border-radius:14px;background:var(--pd-soft);font-size:13px;margin-bottom:18px}
#app .pd-notice>span:nth-child(2){flex:1;min-width:0}
#app .pd-notice-error{color:var(--pd-danger)}
#app .pd-notice button{padding:0;min-width:28px;min-height:28px;font-size:20px}
#app a{color:var(--pd-green);overflow-wrap:anywhere;font-size:13px}
#app .pd-check{z-index:2}
#app .pd-search input{font-size:16px;min-height:24px}
#app select{font-size:16px}
#app button{min-height:42px}
#app #pd-nav button{min-height:50px}
#app .pd-row{flex-wrap:wrap}
#app .pd-row.pd-between{flex-wrap:nowrap}
#app .pd-row.pd-between>*{min-width:0}
#app .pd-generation .pd-grow{max-width:calc(100% - 70px)}
@media(min-width:440px){#app .pd-cardgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 16px}#app .pd-cardtitle{font-size:14px}#app .pd-value{font-size:43px}}
@media(max-width:370px){#pd-banner{padding:0 15px}#app .pd-tag{font-size:10px;padding:5px 7px}#app .pd-brand{font-size:17px}#app .pd-brandmark{width:28px;height:28px}#app .pd-metrics{gap:12px}#app .pd-metrics>div+div{padding-left:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

#app .pd-camera-name #pd-camera-frame{aspect-ratio:4.2;width:90%}
#app .pd-camera-number #pd-camera-frame{aspect-ratio:4.8;width:90%}
#app .pd-featured-result{background:var(--pd-soft);padding:14px}
#app details summary{color:var(--pd-green);padding:14px 0;cursor:pointer}
#app .pd-camera-name,#app .pd-camera-number{aspect-ratio:1.3;max-height:330px}

#app .pd-dex-progress{padding-bottom:12px}
#app .pd-dex-percentage{font-size:28px;line-height:1.1;font-weight:650;letter-spacing:-1px;color:var(--pd-green);white-space:nowrap}
#app .pd-dex-track{height:11px;border-radius:999px;background:var(--pd-soft);overflow:hidden;margin-top:20px}
#app .pd-dex-fill{display:block;height:100%;border-radius:inherit;background:var(--pd-green)}

    content.innerHTML=`<div class="pd-stack"><h1>Ganz nach dir.</h1><span class="pd-tag" style="align-self:flex-start">Version 4.4.1 · Preise für koreanische Karten</span><section class="pd-surface"><h2>Dein iPhone-Album</h2><p class="pd-small pd-muted" style="margin-top:9px">In Safari: Teilen → Zum Home-Bildschirm → als Web-App öffnen. Starte danach das neue Symbol, bevor du deine Sammlung anlegst.</p><p class="pd-small pd-muted" style="margin-top:9px">Safari und die Home-Bildschirm-App können getrennte Speicher verwenden. Für einen Wechsel vorher eine Sicherung exportieren.</p></section><section class="pd-surface pd-substack"><h2>Erscheinungsbild</h2><div class="pd-segment">${[['system','System'],['light','Hell'],['dark','Dunkel']].map(([value,label])=>`<button data-action="theme" data-value="${value}" aria-pressed="${theme===value}">${label}</button>`).join('')}</div><label class="pd-field">Kartensprache${languagePicker()}</label></section><section class="pd-surface pd-substack"><h2>Lokale Text-KI</h2><label class="pd-setting"><span>Kleine Schrift mit Textmodell lesen</span><input id="pd-text-settings" type="checkbox" ${textEnabled?'checked':''}></label><p class="pd-small pd-muted">PaddleOCR liest Namen, KP und Nummer auf deinem Gerät. Vier Modelle mit zusammen ca. 36,6 MB plus Laufzeitdateien. Deutsch, Englisch, Japanisch und Koreanisch werden automatisch geprüft. Keine Foto-Uploads. Bei Bedarf fällt die Analyse auf Tesseract zurück.</p></section><section class="pd-surface pd-substack"><h2>Lokale Bild-KI</h2><label class="pd-setting"><span>Illustration zusätzlich vergleichen</span><input id="pd-neural-settings" type="checkbox" ${neuralEnabled?'checked':''}></label><p class="pd-small pd-muted">DINOv2 vergleicht Bildmerkmale auf deinem Gerät. Der erste Download benötigt ca. 25 MB für das Modell und zusätzliche Laufzeitdateien. Bilder werden nicht hochgeladen. Kein Ersatz für Nummer und Set; keine Zustandsbewertung.</p></section><section class="pd-surface"><h2>Marktpreise</h2><label class="pd-setting"><span>Automatisch aktualisieren</span><input id="pd-auto-refresh" type="checkbox" ${autoRefresh?'checked':''}></label><button class="pd-secondary" data-action="refresh-prices" ${refreshing||!entries.length?'disabled':''}>${icon('refresh-cw')}Preise jetzt abfragen</button><p id="pd-price-progress" class="pd-small pd-muted" style="margin-top:10px">${refreshing?'Preise werden abgefragt …':'Beim Öffnen und während der Nutzung nach frühestens sechs Stunden. Keine Abfragen bei geschlossener App.'}</p></section><section class="pd-surface pd-substack"><h2>Deine Daten</h2><p class="pd-small pd-muted">Sammlung lokal im Browserspeicher. Keine gespeicherten Aufnahmen, keine Foto-Uploads und keine automatische Cloud-Synchronisierung.</p><button class="pd-secondary" data-action="export" ${!ready?'disabled':''}>${icon('download')}Sicherung exportieren</button><label class="pd-upload">${icon('upload')}Sicherung wiederherstellen<input id="pd-import" type="file" accept="application/json,.json" aria-label="Sicherung importieren"></label><p class="pd-small pd-muted">Speicher: ${persisted?'beständig zugesichert':'nicht dauerhaft zugesichert'} · Sicherheitskopie auf dem Gerät aktiv · ${lastBackupAt?'letzte Sicherung '+new Date(lastBackupAt).toLocaleDateString('de-DE'):'noch keine Sicherung'}</p><p class="pd-small pd-muted">Browserdaten können gelöscht werden, etwa beim Aufräumen des Gerätes. Sichere deine Sammlung regelmäßig in „Dateien“ oder iCloud Drive.</p><button class="pd-secondary" data-action="persistent-storage">Beständigen Speicher anfragen</button></section><section class="pd-surface pd-substack"><h2>Katalog & Quellen</h2><p class="pd-small pd-muted">${currentCatalog().length.toLocaleString('de-DE')} Karten · ${languageNames[language]}<br>${species.length.toLocaleString('de-DE')} Pokémon</p><button class="pd-secondary" data-action="refresh-catalog">Kartenkatalog aktualisieren</button><a href="https://www.paddleocr.ai/latest/en/version3.x/inference_deployment/cross_platform/browser.html" target="_blank" rel="noopener">PaddleOCR · lokale Text-KI</a><a href="./LIZENZ-PADDLEOCR.txt" target="_blank" rel="noopener">PaddleOCR-Lizenz</a><a href="https://tcgdex.dev" target="_blank" rel="noopener">TCGdex · Karten und Preise</a><a href="https://github.com/naptha/tesseract.js" target="_blank" rel="noopener">Tesseract.js · lokale Texterkennung</a><p class="pd-small pd-muted">Kartendaten, einzelne Varianten und Preise können beim Anbieter fehlen. Pokémon-Namen und Abbildungen gehören ihren jeweiligen Rechteinhabern.</p></section></div>`;
  }
  async function markBackup(){lastBackupAt=Date.now();try{await db.put('settings','lastBackupAt',lastBackupAt);}catch{}if(page==='home')render();}
  async function exportBackup(){
    try{const backup={format:'PocketDeckWeb',schemaVersion:1,exportedAt:new Date().toISOString(),entries:entries.map(safeEntry)};C.validBackup(backup);const name='PocketDeck-'+new Date().toISOString().slice(0,10)+'.json',blob=new Blob([JSON.stringify(backup)],{type:'application/json'});
      const file=typeof File==='function'?new File([blob],name,{type:'application/json'}):null;
      if(file&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'PocketDeck-Sicherung'});await markBackup();notice('Sicherung gespeichert. Tipp: in „Dateien“ › iCloud Drive ablegen.');return;}catch(e){if(e.name==='AbortError')return;}}
      await markBackup();const url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=name;document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notice('Sicherung vorbereitet. Speichere die JSON-Datei in „Dateien“ oder iCloud Drive.');}
    catch(e){notice(e.message,'error');}
  }
  async function importBackup(file){
    try{if(file.size>50000000)throw Error('Die Sicherung ist größer als 50 MB.');const backup=C.validBackup(JSON.parse(await file.text())),updated=backup.entries.map(safeEntry);if(!confirm(`Sammlung durch ${C.stats(updated).cards} Karten aus der Sicherung ersetzen? Die aktuelle Sammlung wird ersetzt.`))return;
      if(!db)throw Error('Der lokale Speicher ist nicht verfügbar.');await db.commit(updated);entries=updated;mirrorCollection(updated);ready=true;go('home');notice('Sammlung wiederhergestellt. Die Sicherung enthält keine Aufnahmebilder.');
    }catch(e){notice('Sicherung nicht übernommen. '+e.message,'error');}
  }
  root.addEventListener('click',async event=>{
    const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
    try{
      if(action==='nav'){if(button.dataset.page==='album'){mode='pokemon';query='';limit=60;}go(button.dataset.page);return;}
      if(action==='dismiss-notice'){notice('');return;}
      if(action==='more'){limit+=60;albumResults();return;}
      if(action==='open-pokedex'||action==='album-cards'){mode=action==='open-pokedex'?'pokemon':'cards';pokemonType=0;filter='all';query='';limit=60;go('album');return;}
      if(action==='pokemon'){await openPokemon(Number(button.dataset.dex));return;}
      if(action==='pokemon-view'){pokemonView=button.dataset.view;render();return;}
      if(action==='pokemon-add'){mode='cards';pokemonType=0;query=pokemonName(species.find(s=>s.id===pokemonSelection));filter='all';limit=60;manualScan=true;page='album';render();return;}
      if(action==='card'){await openCard(button.dataset.id,button.dataset.language,manualScan);return;}
      if(action==='scan-candidate'){const candidate=scan.candidates.find(c=>c.card.id===button.dataset.id);if(candidate?.setMatch===false&&!confirm('Die erkannte Setgröße passt nicht zu dieser Ausgabe. Trotzdem zum manuellen Prüfen öffnen?'))return;await openCard(button.dataset.id,scan.language,true);return;}
      if(action==='retry-card'){await openCard(selection.id,selection.language,page==='review');return;}
      if(action==='refresh-card'){const target=selection;target.loading=true;render();try{const card=await cardDetail(target.language,target.id,true);target.card=card;await mutate(current=>current.map(e=>e.card.id===target.id&&e.language===target.language?{...e,card,priceCheckedAt:Date.now()}:e));target.error=null;}catch(e){target.error=e.message;}finally{target.loading=false;if(selection===target&&page==='detail')render();}return;}
      if(action==='add-review'){reviewEntry=null;page='review';render();return;}
      if(action==='edit-copy'){reviewEntry=entries.find(e=>e.id===button.dataset.id);selection={id:reviewEntry.card.id,language:reviewEntry.language,card:reviewEntry.card,variant:reviewEntry.variantID,loading:false};page='review';render();return;}
      if(action==='review-back'){go('detail');return;}
      if(action==='delete-copy'){if(confirm('Dieses Exemplar aus der Sammlung entfernen?')){const id=reviewEntry.id;await mutate(current=>current.filter(e=>e.id!==id));reviewEntry=null;go('detail');}return;}
      if(action==='scan-mode'){if(scan.busy)return;scanFocus=button.dataset.mode;if(scanFocus==='card'){scanNames='';scanNumbers=[];scan.done=false;scan.candidates=[];}if(live){live.stable=0;live.since=Date.now();}render();if(cameraWanted&&!stream&&ready)await startCamera();document.getElementById('pd-camera-box')?.scrollIntoView?.({block:'center',behavior:'smooth'});return;}
      if(action==='scan-reset'){scanNames='';scanNumbers=[];scanFocus='card';scan.done=false;scan.candidates=[];scan.error=null;render();if(cameraWanted&&!stream&&ready)await startCamera();window.scrollTo({top:0,behavior:'smooth'});return;}
      if(action==='start-camera'){await startCamera();return;}
      if(action==='stop-camera'){cameraWanted=false;stopCamera();render();return;}
      if(action==='switch-camera'){await switchCamera();return;}
      if(action==='torch'){await toggleTorch();return;}
      if(action==='capture'){await captureAndAnalyze();return;}
      if(action==='skip-neural'){cancelNeural?.();return;}
      if(action==='cancel-analysis'){await cancelAnalysis();return;}
      if(action==='manual-search'){mode='cards';query='';filter='all';page='album';manualScan=true;render();return;}
      if(action==='refresh-prices'){await refreshPrices(true);return;}
      if(action==='theme'){theme=button.dataset.value;await db.put('settings','theme',theme);render();return;}
      if(action==='export'){await exportBackup();return;}
      if(action==='persistent-storage'){const persisted=await navigator.storage?.persist?.();notice(persisted?'Der Browser hat beständigen Speicher gewährt. Sicherungen bleiben sinnvoll.':'Der Browser hat keine Beständigkeit zugesichert. Bitte regelmäßig Sicherungen exportieren.');return;}
      if(action==='refresh-catalog'){if(language==='ko'){notice('Koreanische Scans verwenden den japanischen Referenzkatalog. Es werden keine japanischen Preise als KR-Preise übernommen.');return;}button.disabled=true;button.textContent='Katalog wird geladen …';const cards=await fetchJSON(`https://api.tcgdex.net/v2/${language}/cards`);if(!Array.isArray(cards)||!cards.length)throw Error('Ungültiger Katalog.');catalogues[language]=cards.filter(c=>!String(c.image||'').includes('/tcgp/')).map(c=>({...c,localId:String(c.localId)}));await db.put('cache','catalog:'+language,catalogues[language]);const expansions=await fetchJSON(`https://api.tcgdex.net/v2/${language}/sets`);setIndexes[language]=Object.fromEntries(expansions.map(s=>[s.id,{name:s.name,official:s.cardCount?.official,total:s.cardCount?.total}]));await db.put('cache','sets:'+language,setIndexes[language]);render();notice('Kartenkatalog und Set-Nummern aktualisiert.');return;}
    }catch(e){notice(e.message,'error');if(action==='capture'&&e.keepCamera){startLive();}else if(action==='capture'){stopCamera();scan.busy=false;scan.done=true;scan.error=e.message;render();setTimeout(()=>document.getElementById('pd-scan-result')?.scrollIntoView?.({block:'start',behavior:'smooth'}),0);}else if(action==='refresh-catalog')render();}
  });
  let searchTimer;
  root.addEventListener('input',event=>{if(event.target.id==='pd-search'){query=event.target.value;limit=60;clearTimeout(searchTimer);searchTimer=setTimeout(albumResults,100);}});
  root.addEventListener('input',event=>{if(event.target.id==='pd-zoom'&&stream&&cameraZoom){const value=Number(event.target.value);cameraZoom.value=value;stream.getVideoTracks()[0]?.applyConstraints({advanced:[{zoom:value}]}).catch(()=>{});}});
  root.addEventListener('submit',event=>{if(event.target.id==='pd-review'){event.preventDefault();saveReview(event.target);}});
  root.addEventListener('change',async event=>{
    const target=event.target;
    try{
      if(target.id==='pd-language'){language=target.value;scanNames='';scanNumbers=[];scan.done=false;scan.candidates=[];await db.put('settings','language',language);query='';limit=60;render();}
      if(target.id==='pd-filter'){filter=target.value;limit=60;albumResults();}
      if(target.id==='pd-pokemon-type'){pokemonType=Number(target.value);limit=60;albumResults();}
      if(target.id==='pd-detail-variant'){selection.variant=target.value;render();}
      if(['pd-neural-toggle','pd-neural-settings'].includes(target.id)){neuralEnabled=target.checked;await db.put('settings','neuralEnabled',neuralEnabled);}
      if(target.id==='pd-text-settings'){textEnabled=target.checked;await db.put('settings','textEnabled',textEnabled);}
      if(target.id==='pd-auto-capture'){autoCapture=target.checked;if(live){live.stable=0;live.since=Date.now();}await db.put('settings','autoCapture',autoCapture);}
      if(target.id==='pd-auto-refresh'){autoRefresh=target.checked;await db.put('settings','autoRefresh',autoRefresh);}
      if(target.id==='pd-import'&&target.files[0]){const file=target.files[0];target.value='';await importBackup(file);}
      if(target.id==='pd-scan-file'&&target.files[0]&&!scan.busy){let file=target.files[0];target.value='';const canvas=await canvasFromFile(file);file=null;await analyze(canvas);}
    }catch(e){notice(e.message,'error');if(target.id==='pd-scan-file'){scan.busy=false;scan.done=true;scan.error='Das Foto konnte nicht verarbeitet werden: '+e.message;render();setTimeout(()=>document.getElementById('pd-scan-result')?.scrollIntoView?.({block:'start',behavior:'smooth'}),0);}}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden){resumeCamera=!!stream;stopCamera();}else{if(page==='scan'&&!scan.busy){render();if(resumeCamera&&ready)startCamera();}resumeCamera=false;if(autoRefresh)refreshPrices();}});
  window.addEventListener('pagehide',()=>{cancelTextOCR?.();cancelTextOCR=null;cancelNeural?.();if(activeNeuralCapture?.data.byteLength)activeNeuralCapture.data.fill(0);activeNeuralCapture=null;stopCamera();analysisID++;ocrWorker?.terminate().catch(()=>{});});
  setInterval(()=>{if(autoRefresh&&!document.hidden)refreshPrices();},900000);
  function setNav(hide){if(hide===navHidden)return;navHidden=hide;nav.classList.toggle('pd-nav-hidden',hide);}
  let lastScrollY=window.scrollY,scrollQueued=false;
  window.addEventListener('scroll',()=>{if(scrollQueued)return;scrollQueued=true;requestAnimationFrame(()=>{scrollQueued=false;const y=Math.max(0,window.scrollY),dy=y-lastScrollY;if(y<40)setNav(false);else if(dy>8)setNav(true);else if(dy<-8)setNav(false);if(Math.abs(dy)>8||y<40)lastScrollY=y;});},{passive:true});
  async function initialize(){
    render();
    try{
      try{await catalogReady;}catch(e){notice(e.message+' Scannen und Suche sind erst nach einem Neuladen mit Internet möglich.','error');}
      db=await new PocketDeckStorage().open();const saved=await db.read('collection','state');if(saved){if(saved.schemaVersion!==1)throw Error('Unbekannte Sammlungsversion.');entries=C.validEntries(saved.entries).map(safeEntry);}
      if(!entries.length){const mirror=await readMirror();if(mirror){entries=mirror;await db.commit(entries);notice(`Deine Sammlung (${entries.length} Einträge) wurde aus der Sicherheitskopie auf diesem Gerät wiederhergestellt.`);}}
      lastBackupAt=Number(await db.read('settings','lastBackupAt'))||0;
      persisted=await navigator.storage?.persisted?.().catch(()=>false)||false;if(!persisted&&entries.length)persisted=await navigator.storage?.persist?.().catch(()=>false)||false;
      language=await db.read('settings','language')||'de';if(!C.languages.includes(language))language='de';theme=await db.read('settings','theme')||'dark';textEnabled=(await db.read('settings','textEnabled'))!==false;autoRefresh=(await db.read('settings','autoRefresh'))!==false;neuralEnabled=(await db.read('settings','neuralEnabled'))!==false;autoCapture=(await db.read('settings','autoCapture'))!==false;
      for(const lang of C.languages){const cached=await db.read('cache','catalog:'+lang);if(Array.isArray(cached)&&cached.length)catalogues[lang]=cached;const cachedSets=await db.read('cache','sets:'+lang);if(cachedSets&&typeof cachedSets==='object')setIndexes[lang]=cachedSets;}
      ready=true;render();if(autoRefresh)refreshPrices();
    }catch(e){ready=false;notice('Lokaler Speicher nicht verfügbar: '+e.message+' Bitte die App über eine HTTPS-Adresse in Safari öffnen. Bestehende Daten werden nicht überschrieben.','error');render();}
    if('serviceWorker'in navigator&&['https:','http:'].includes(location.protocol)){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(registration=>registration.update()).catch(()=>{});}
    if(location.protocol==='file:')notice('Zum zuverlässigen Einsatz auf dem iPhone bitte die GitHub-Pages-Adresse in Safari öffnen. Eine Datei-Vorschau reicht dafür nicht.');
  }
  initialize();
})();
